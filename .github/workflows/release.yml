name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag on main, green CI push run, matching version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "$TAG^{commit}")
          if [ "$sha" != "$GITHUB_SHA" ]; then echo "refused: $TAG does not point at $GITHUB_SHA"; exit 1; fi
          if git merge-base --is-ancestor "$sha" origin/main; then on_main=true; else on_main=false; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=100" --jq '[.workflow_runs[] | {conclusion, head_sha, event}]' >"$RUNNER_TEMP/runs.json"
          version=$(jq -r .version .claude-plugin/plugin.json)
          # The version of Cargo.toml's [package] table; empty when there is none, which the gate refuses.
          cargo_version=$(awk '/^\[/ { p = ($0 == "[package]") } p && /^version = "/ { gsub(/^version = "|"$/, ""); print; exit }' Cargo.toml)
          sh scripts/release/gate.sh "$TAG" "$sha" "$on_main" "$RUNNER_TEMP/runs.json" "$version" "$cargo_version"
  build:
    needs: validate
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, os: macos, arch: aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, os: macos, arch: x86_64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, os: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, os: linux, arch: aarch64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, os: windows, arch: x86_64 }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc, os: windows, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.95.0 and the target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --target "$TARGET"
          rustup default 1.95.0
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y musl-tools; fi
      - name: Package
        shell: bash
        run: sh scripts/release/package.sh --target "$TARGET" --os "$OS" --arch "$ARCH" --out package
      # Only the binary: publish writes the one SHA256SUMS over all six.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: package/${{ matrix.os }}-${{ matrix.arch }}/mux-agent*
          if-no-files-found: error
  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release moves dist at a time; a queued one waits and is never cancelled.
    concurrency:
      group: release-dist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each artifact lands in scripts/bin/<os>-<arch>/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: scripts/bin
      # dist is the tagged tree plus scripts/bin, and only moves to a newer version. Each dist commit's parent is
      # its tagged commit, so dist is replaced, not extended: the push leases the dist it read.
      - name: Commit the binaries to dist and create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          # git's credential helper reads the token from this environment when git runs it; no command line holds it.
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
        run: |
          set -euo pipefail
          # Artifacts drop the executable bit.
          chmod 0755 scripts/bin/*/mux-agent*
          sh scripts/release/package.sh --assemble scripts/bin
          if [ "$(wc -l <scripts/bin/SHA256SUMS)" -ne 6 ]; then echo "refused: expected 6 binaries"; cat scripts/bin/SHA256SUMS; exit 1; fi
          # The tag must still name the commit validate approved and build packaged, read just before pushing.
          line=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1)
          if [ "$(printf '%s\n' "$line" | cut -f1)" != "$GITHUB_SHA" ]; then echo "refused: $TAG no longer points at $GITHUB_SHA"; exit 1; fi
          # The current dist: its version and the tagged commit it was built from (its parent), or none.
          dist=$(git ls-remote origin refs/heads/dist | cut -f1)
          dist_version='' dist_sha=''
          if [ -n "$dist" ]; then
            git fetch -q --no-tags --depth=1 origin "$dist"
            dist_version=$(git show "$dist:.claude-plugin/plugin.json" | jq -r .version)
            dist_sha=$(git cat-file -p "$dist" | awk '$1 == "parent" && !p { print $2; p = 1 }')
          fi
          version=$(jq -r .version .claude-plugin/plugin.json)
          if ! decision=$(sh scripts/release/gate.sh --dist "$version" "$GITHUB_SHA" "$dist_version" "$dist_sha"); then echo "$decision"; exit 1; fi
          if [ "$decision" = push ]; then
            git add -f scripts/bin
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "dist $TAG"
            git push --force-with-lease=refs/heads/dist:"$dist" origin HEAD:refs/heads/dist
          else
            echo "dist already holds $version from $GITHUB_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          options=(--verify-tag --title "$TAG" --generate-notes)
          notes="wiki/Release-$TAG.md"
          if [ -f "$notes" ]; then options+=(--notes-file "$notes"); fi
          gh release create "$TAG" "${options[@]}"
