name: Publish wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-wiki
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The only job that writes: it pushes the mirror to the wiki's master. The grant lives on the job so it cannot widen to a sibling.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone the wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
      - name: Mirror wiki/ into it
        id: mirror
        shell: pwsh
        run: ./scripts/wiki/Publish-MuxAgentWiki.ps1 -Source wiki -WikiRepo wiki-repo -SourceSha $env:GITHUB_SHA
      - name: Push the mirror
        if: steps.mirror.outputs.changed == 'true'
        run: git -C wiki-repo push origin HEAD:master
