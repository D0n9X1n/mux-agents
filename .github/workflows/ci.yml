name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12 (SHA-256 pinned)
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: actionlint
        run: ./actionlint -color
      - name: Manifests parse as JSON
        shell: pwsh
        run: foreach ($file in '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json') { $null = Get-Content -Raw $file | ConvertFrom-Json }
      - name: Install Claude Code 2.1.310
        run: npm install --global @anthropic-ai/claude-code@2.1.310
      - name: claude plugin validate
        run: claude plugin validate .
      - name: claude plugin test
        run: claude plugin test .
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point TEMP and TMP at RUNNER_TEMP (the default is an 8.3 path)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Install Pester 4.10.1
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Install powershell-yaml 0.4.12
        shell: pwsh
        run: Install-Module powershell-yaml -RequiredVersion 0.4.12 -Force -Scope CurrentUser
      - name: Tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/Invoke-MuxAgentTests.ps1
      # The Rust rewrite's own tests, so its Linux and Windows code runs on those hosts.
      - name: Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt && rustup default 1.95.0
      - name: Rust tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features test-panic --locked -- -D warnings
          cargo test --features test-panic --locked
          cargo test --release --features test-panic --locked --test panic
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tmux 3.2 or later
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y tmux; else brew install tmux; fi
          tmux -V
      - name: Install Pester 4.10.1
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Integration tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/Invoke-MuxAgentTests.ps1 -Path tests/integration -Integration
