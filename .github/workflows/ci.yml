name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12 (SHA-256 pinned)
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
      - name: actionlint
        run: ./actionlint -color
      - name: Manifests parse as JSON
        run: jq . .claude-plugin/plugin.json .claude-plugin/marketplace.json >/dev/null
      - name: shellcheck the sh scripts
        run: |
          set -euo pipefail
          git ls-files -z 'scripts/*.sh' scripts/mux-agent 'tests/*.sh' | xargs -0 shellcheck
      - name: Install Claude Code 2.1.310
        run: npm install --global @anthropic-ai/claude-code@2.1.310
      - name: claude plugin validate
        run: claude plugin validate .
      - name: claude plugin test
        run: claude plugin test .
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point TEMP and TMP at RUNNER_TEMP (the default is an 8.3 path)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Rust 1.95.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
      # bash -e on every OS, so the first failing command fails the step.
      - name: Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --features test-panic --locked -- -D warnings
          cargo test --features test-panic --locked
      - name: Release build
        shell: bash
        run: cargo build --release --locked
      # Outside a multiplexer the cmd shim reaches target\release\mux-agent.exe, which refuses with check endpoint.
      - name: Windows shim reaches the release binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          unset TMUX RMUX TMUX_PANE MUX_AGENTS_BIN
          rc=0
          out=$(cmd //d //c 'scripts\mux-agent.cmd' list 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" != 1 ]; then echo "expected exit 1, got $rc"; exit 1; fi
          case $out in *'"check":"endpoint"'*) ;; *) echo 'expected check endpoint'; exit 1 ;; esac
      # #93: on Windows Copilot runs each hook's portable command; run every one through the cmd shim to the release
      # binary, which refuses outside a multiplexer: -Quiet must print nothing and exit 0.
      - name: Windows Copilot hook commands
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          unset TMUX RMUX TMUX_PANE MUX_AGENTS_BIN
          n=0
          while IFS= read -r hook; do
            n=$((n + 1))
            rc=0
            out=$(cmd //d //c "$hook" 2>&1) || rc=$?
            if [ "$rc" != 0 ] || [ -n "$out" ]; then echo "$hook: exit $rc, printed: $out"; exit 1; fi
          done < <(python3 -c 'import json; [print(e["command"]) for es in json.load(open("hooks.json"))["hooks"].values() for e in es]')
          [ "$n" = 5 ] || { echo "expected 5 hook commands, ran $n"; exit 1; }
      - name: Release panic test
        shell: bash
        run: cargo test --release --features test-panic --locked --test panic
      # The shell shortcut cases run under bash and zsh; macOS ships zsh.
      - name: Install zsh
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Shim tests (sh)
        if: runner.os != 'Windows'
        shell: bash
        run: sh tests/shim.sh
      # Git Bash: the sh shim maps MINGW to the Windows binary, and cc's arguments reach a native program unchanged.
      # Git Bash has no zsh.
      - name: Shim tests (Git Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: SHIM_SHELLS=bash bash tests/shim.sh
      # shim.cmd builds its stub with the .NET Framework csc.exe; its last line counts the failures.
      - name: Shim tests (cmd)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          out=$(cmd //d //c 'tests\shim.cmd' 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" != 0 ] || [ "$(printf '%s\n' "$out" | tail -n 1 | tr -d '\r')" != '0 failed' ]; then exit 1; fi
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.95.0 and the release targets
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-musl x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      # check only: no linker for the other targets is needed.
      - name: cargo check every target
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-musl x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            cargo check --all-targets --locked --target "$target"
          done
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tmux and the tmux 3.2a build dependencies
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y tmux libevent-dev libncurses-dev bison pkg-config build-essential
          else
            brew install tmux libevent pkg-config
          fi
          tmux -V
      - name: Rust 1.95.0
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          # tests/release.sh cross-builds the other Apple arch on macOS.
          if [ "$RUNNER_OS" = macOS ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi
      # rmux from crates.io at a pinned version, with its own lockfile: `rmux` and `rmux-daemon` land in ~/.cargo/bin.
      - name: Install rmux 0.10.0
        run: |
          set -euo pipefail
          cargo install rmux --version 0.10.0 --locked
          rmux -V
      - name: Build tmux 3.2a
        run: |
          set -euo pipefail
          out=$(sh scripts/dev/tmux32.sh)
          line=$(printf '%s\n' "$out" | tail -n 1)
          case $line in MUX_AGENTS_TMUX32=/*) ;; *) echo "unexpected: $line"; exit 1 ;; esac
          echo "$line" >> "$GITHUB_ENV"
      - name: Install private-test core binary 0.1.21
        shell: bash
        run: sh scripts/dev/hc.sh
      - name: Private core fixture tests
        shell: bash
        run: cargo test --features live,test-panic --locked --test live_core -- --nocapture
      # A multiplexer the run cannot find fails the suite instead of skipping its tests (#71); the preflight prints
      # each one's version and binary.
      - name: Live preflight
        env:
          MUX_AGENTS_LIVE_REQUIRE: tmux,tmux32,rmux
        run: cargo test --features live,test-panic --locked --test live preflight -- --nocapture
      - name: CLI tests that need the fake client
        shell: bash
        run: cargo test --features live,test-panic --locked --test cli
      - name: Live tests
        env:
          MUX_AGENTS_LIVE_REQUIRE: tmux,tmux32,rmux
        run: cargo test --features live,test-panic --locked --test live
      - name: Release script tests
        run: sh tests/release.sh
      - name: Wiki publisher tests
        run: sh tests/wiki.sh
      # The real one-line upgrade: marketplace update, then plugin update, moves an installed mux-agents to a new
      # version; the marketplace is served from a local repository, so every git fetch stays on the runner.
      - name: Install Claude Code 2.1.310
        run: npm install --global @anthropic-ai/claude-code@2.1.310
      - name: Upgrade tests
        run: sh tests/upgrade.sh
  # The side bar's clicks and keys on Windows (#70), in a private rmux server. The release rmux 0.10.0 cannot start
  # its daemon inside the runner's job object (rmux#238: "Access is denied"); its own CI runs a debug build with the
  # debug-only RMUX_ALLOW_INTERNAL_DAEMON_IN_CALLER_JOB=1, and so does this job, from the v0.10.0 commit. Swap in the
  # release zip, pinned by SHA-256, once a release fixes #238.
  integration-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RMUX_ALLOW_INTERNAL_DAEMON_IN_CALLER_JOB: '1'
      MUX_AGENTS_LIVE_REQUIRE: rmux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point TEMP and TMP at RUNNER_TEMP (the default is an 8.3 path)
        shell: bash
        run: |
          set -euo pipefail
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # rmux pins its own toolchain (1.96.1) in rust-toolchain.toml; rustup installs it in that directory.
      - name: Build rmux 0.10.0 (debug, commit dfd68c77 of tag v0.10.0)
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/rmux-src"
          cd "$RUNNER_TEMP/rmux-src"
          git fetch -q --depth 1 https://github.com/Helvesec/rmux dfd68c774ca0f4212139a21d37d09c90f75f8bd7
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = dfd68c774ca0f4212139a21d37d09c90f75f8bd7
          cargo build --locked --bin rmux
          echo "$RUNNER_TEMP/rmux-src/target/debug" >> "$GITHUB_PATH"
      - name: Rust 1.95.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
      - name: Install private-test core binary 0.1.21
        shell: bash
        run: sh scripts/dev/hc.sh
      - name: Private core fixture tests
        shell: bash
        run: cargo test --features live,test-panic --locked --test live_core -- --nocapture
      - name: Clippy with the live tests
        shell: bash
        run: cargo clippy --all-targets --features live,test-panic --locked -- -D warnings
      - name: CLI tests that need the fake client
        shell: bash
        run: cargo test --features live,test-panic --locked --test cli
      - name: Windows live tests
        shell: bash
        run: |
          set -euo pipefail
          rmux -V
          cargo test --features live,test-panic --locked --test live_windows -- --nocapture
